name: Backend & Web CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "web/**"
      - "tests/**"
      - "pyproject.toml"
      - "docker-compose.yml"
      - "deploy/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest + migration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: eval_test
          POSTGRES_USER: eval
          POSTGRES_PASSWORD: eval
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U eval -d eval_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: pytest (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://eval:eval@127.0.0.1:5432/eval_test
        run: pytest
      - name: Migration dry-run on an empty database
        env:
          PGPASSWORD: eval
        run: |
          psql -h 127.0.0.1 -U eval -d eval_test -c "CREATE DATABASE eval_migrate"
          cd backend
          DATABASE_URL="postgresql+psycopg://eval:eval@127.0.0.1:5432/eval_migrate" alembic upgrade head
          DATABASE_URL="postgresql+psycopg://eval:eval@127.0.0.1:5432/eval_migrate" alembic upgrade head

  web:
    name: web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: web
        run: npm run build

  deployment-contract:
    name: deployment contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static deploy contract tests
        run: node --test tests/deploy/*.test.mjs

  runner:
    name: runner (node contract tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # tests/runner was previously only runnable locally; M4-01 makes the
      # per-case matrix entry and plan-cases script gated in CI.
      - name: Runner and matrix tests
        run: node --test tests/runner/*.test.mjs
