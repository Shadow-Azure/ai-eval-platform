name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "web/**"
      - "deploy/**"
      - "runner/**"
      - "runner-contract/schemas/**"
      - "scripts/cache-runner-scripts.py"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
  # M5-18: a console administrator can ask for the previous application
  # images to be restored. The API dispatches this event; the rollback job
  # below runs deploy/rollback.sh on the host. Database downgrade never runs.
  repository_dispatch:
    types: [deployment-rollback]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
  ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}

jobs:
  build:
    name: build and push images
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      api_digest: ${{ steps.api.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push API/worker image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/ai-eval-platform-api:${{ github.sha }}
      - name: Build and push web image
        id: web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: web/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/ai-eval-platform-web:${{ github.sha }}

  # M5-08/M5-11: keep one stable actions-runner archive in OSS. Spot cloud-init
  # cannot reliably pull ~10 MB from GitHub inside its timeout, so every deploy
  # reuses (or uploads) the cached object; the api serves it through the fixed
  # /runner/v1/runner-tarball/<version>.tar.gz proxy, so no expiring presigned
  # URL is injected into the deployment.
  runner-cache:
    name: cache runner tarball in OSS
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      S3_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
      S3_BUCKET: ${{ secrets.OSS_BUCKET }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      S3_ADDRESSING_STYLE: virtual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Derive the OSS region from the Aliyun region
        id: region
        run: |
          region="${{ secrets.ALIYUN_REGION }}"
          case "$region" in
            oss-*) ;;
            *) region="oss-$region" ;;
          esac
          echo "value=$region" >> "$GITHUB_OUTPUT"
      - name: Ensure the runner tarball exists in OSS
        env:
          S3_REGION: ${{ steps.region.outputs.value }}
        run: python scripts/cache-runner-tarball.py

  # M5-12: build one deterministic, content-addressed scripts bundle per
  # deployed commit and cache it in the same private OSS bucket. The api serves
  # it through /runner/v1/scripts/<name>, so prepare/execute do not clone the
  # platform repository.
  scripts-bundle:
    name: cache runner scripts bundle in OSS
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      name: ${{ steps.bundle.outputs.name }}
      md5: ${{ steps.bundle.outputs.md5 }}
      sha256: ${{ steps.bundle.outputs.sha256 }}
      size: ${{ steps.bundle.outputs.size }}
    env:
      S3_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
      S3_BUCKET: ${{ secrets.OSS_BUCKET }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      S3_ADDRESSING_STYLE: virtual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Derive the OSS region from the Aliyun region
        id: region
        run: |
          region="${{ secrets.ALIYUN_REGION }}"
          case "$region" in
            oss-*) ;;
            *) region="oss-$region" ;;
          esac
          echo "value=$region" >> "$GITHUB_OUTPUT"
      - name: Build and cache the runner scripts bundle
        id: bundle
        env:
          S3_REGION: ${{ steps.region.outputs.value }}
        run: python scripts/cache-runner-scripts.py --repo-root . --github-output "$GITHUB_OUTPUT"

  deploy:
    name: migrate and deploy to ECS
    if: github.event_name != 'repository_dispatch'
    needs: [build, runner-cache, scripts-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      AUTH_BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.AUTH_BOOTSTRAP_ADMIN_EMAIL }}
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.AUTH_BOOTSTRAP_ADMIN_PASSWORD }}
      OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
      OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      ALIYUN_REGION: ${{ secrets.ALIYUN_REGION }}
      DATABASE_STORAGE_LIMIT_BYTES: ${{ secrets.DATABASE_STORAGE_LIMIT_BYTES }}
      DISPATCH_TOKEN: ${{ secrets.FLOW_TOKEN }}
      SECRET_BOX_KEY: ${{ secrets.SECRET_BOX_KEY }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
      GATEWAY_TOKEN_SECRET: ${{ secrets.GATEWAY_TOKEN_SECRET }}
      RUNNER_TASK_SECRET: ${{ secrets.RUNNER_TASK_SECRET }}
      RUNNER_HEARTBEAT_TOKEN: ${{ secrets.RUNNER_HEARTBEAT_TOKEN }}
      RUNNER_ADMIN_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
      # M5-08: VPC-only Runner callback entry. Empty keeps the loopback
      # default and disables the VPC port binding; set both secrets in the
      # production environment to let spot runners reach the API.
      API_BIND_ADDRESS: ${{ secrets.API_BIND_ADDRESS }}
      RUNNER_CALLBACK_BASE_URL: ${{ secrets.RUNNER_CALLBACK_BASE_URL }}
      # M5-11: the api derives the permanent proxy URL from
      # RUNNER_CALLBACK_BASE_URL; an explicit repository secret still overrides
      # it (e.g. a public mirror), and then cloud-init sends no runner token.
      RUNNER_SPOT_RUNNER_TARBALL_URL: ${{ secrets.RUNNER_SPOT_RUNNER_TARBALL_URL }}
      RUNNER_SCRIPTS_BUNDLE_NAME: ${{ needs.scripts-bundle.outputs.name }}
      RUNNER_SCRIPTS_BUNDLE_MD5: ${{ needs.scripts-bundle.outputs.md5 }}
      RUNNER_SCRIPTS_BUNDLE_SHA256: ${{ needs.scripts-bundle.outputs.sha256 }}
      RUNNER_SCRIPTS_BUNDLE_SIZE: ${{ needs.scripts-bundle.outputs.size }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH key
        env:
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ECS_SSH_KEY" | awk '1' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$ECS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Copy deploy scripts
        run: |
          ssh "root@${{ secrets.ECS_HOST }}" 'rm -rf /opt/ai-eval-platform/deploy'
          scp -r deploy "root@${{ secrets.ECS_HOST }}:/opt/ai-eval-platform/"
      - name: Write ACR credentials on the host
        run: |
          printf 'ACR_REGISTRY=%s\nACR_USERNAME=%s\nACR_PASSWORD=%s\n' \
            "${{ secrets.ACR_REGISTRY }}" \
            "${{ secrets.ACR_USERNAME }}" \
            "${{ secrets.ACR_PASSWORD }}" \
            | ssh "root@${{ secrets.ECS_HOST }}" 'umask 077; cat > /opt/ai-eval-platform/.acr.env'
      - name: Write object-store, dispatch and long-lived credentials on the host
        run: |
          region="${ALIYUN_REGION:-cn-hangzhou}"
          case "$region" in
            oss-*) ;;
            *) region="oss-$region" ;;
          esac
          : "${SECRET_BOX_KEY:?SECRET_BOX_KEY secret is required}"
          : "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD secret is required}"
          : "${AUTH_SESSION_SECRET:?AUTH_SESSION_SECRET secret is required}"
          : "${GATEWAY_TOKEN_SECRET:?GATEWAY_TOKEN_SECRET secret is required}"
          : "${RUNNER_TASK_SECRET:?RUNNER_TASK_SECRET secret is required}"
          : "${RUNNER_HEARTBEAT_TOKEN:?RUNNER_HEARTBEAT_TOKEN secret is required}"
          : "${RUNNER_ADMIN_TOKEN:?RUNNER_ADMIN_TOKEN secret is required}"
          : "${RUNNER_SCRIPTS_BUNDLE_NAME:?RUNNER_SCRIPTS_BUNDLE_NAME is required}"
          : "${RUNNER_SCRIPTS_BUNDLE_SHA256:?RUNNER_SCRIPTS_BUNDLE_SHA256 is required}"
          : "${RUNNER_SCRIPTS_BUNDLE_SIZE:?RUNNER_SCRIPTS_BUNDLE_SIZE is required}"
          # M5-08: the runner callback base URL follows the VPC binding. Only
          # set RUNNER_CALLBACK_BASE_URL explicitly to override the derived
          # value (for example a DNS name or a different port).
          callback_base_url="${RUNNER_CALLBACK_BASE_URL:-}"
          if [ -z "$callback_base_url" ] && [ -n "$API_BIND_ADDRESS" ]; then
            callback_base_url="http://${API_BIND_ADDRESS}:8000"
          fi
          expected_hashes="$(
            for name in SECRET_BOX_KEY POSTGRES_PASSWORD AUTH_SESSION_SECRET GATEWAY_TOKEN_SECRET RUNNER_TASK_SECRET RUNNER_HEARTBEAT_TOKEN RUNNER_ADMIN_TOKEN; do
              value="${!name}"
              printf '%s %s\n' "$name" "$(printf '%s' "$value" | sha256sum | cut -d' ' -f1)"
            done
          )"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT HUP INT TERM
          umask 077
          printf '%s\n' "$expected_hashes" >"$work/expected"
          expected_file="$work/expected"
          payload_file="$work/payload"
          {
            printf 'S3_ENDPOINT=%s\n' "$OSS_ENDPOINT"
            printf 'S3_BUCKET=%s\n' "$OSS_BUCKET"
            printf 'S3_ACCESS_KEY=%s\n' "$S3_ACCESS_KEY"
            printf 'S3_SECRET_KEY=%s\n' "$S3_SECRET_KEY"
            printf 'S3_REGION=%s\n' "$region"
            printf 'S3_ADDRESSING_STYLE=virtual\n'
            printf 'GITHUB_TOKEN=%s\n' "$DISPATCH_TOKEN"
            printf 'DATABASE_STORAGE_LIMIT_BYTES=%s\n' "$DATABASE_STORAGE_LIMIT_BYTES"
            printf 'SECRET_BOX_KEY=%s\n' "$SECRET_BOX_KEY"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'AUTH_SESSION_SECRET=%s\n' "$AUTH_SESSION_SECRET"
            printf 'GATEWAY_TOKEN_SECRET=%s\n' "$GATEWAY_TOKEN_SECRET"
            printf 'RUNNER_TASK_SECRET=%s\n' "$RUNNER_TASK_SECRET"
            printf 'RUNNER_HEARTBEAT_TOKEN=%s\n' "$RUNNER_HEARTBEAT_TOKEN"
            printf 'RUNNER_ADMIN_TOKEN=%s\n' "$RUNNER_ADMIN_TOKEN"
            printf 'API_BIND_ADDRESS=%s\n' "$API_BIND_ADDRESS"
            printf 'RUNNER_CALLBACK_BASE_URL=%s\n' "$callback_base_url"
            printf 'RUNNER_SPOT_RUNNER_TARBALL_URL=%s\n' "$RUNNER_SPOT_RUNNER_TARBALL_URL"
            printf 'RUNNER_SCRIPTS_BUNDLE_NAME=%s\n' "$RUNNER_SCRIPTS_BUNDLE_NAME"
            printf 'RUNNER_SCRIPTS_BUNDLE_MD5=%s\n' "$RUNNER_SCRIPTS_BUNDLE_MD5"
            printf 'RUNNER_SCRIPTS_BUNDLE_SHA256=%s\n' "$RUNNER_SCRIPTS_BUNDLE_SHA256"
            printf 'RUNNER_SCRIPTS_BUNDLE_SIZE=%s\n' "$RUNNER_SCRIPTS_BUNDLE_SIZE"
          } >"$payload_file"
          payload_digest="$(sha256sum "$payload_file" | cut -d' ' -f1)"
          bundle="$work/bundle"
          {
            cat "$expected_file"
            printf '%s\n' '--payload--'
            cat "$payload_file"
          } >"$bundle"
          ssh "root@${{ secrets.ECS_HOST }}" \
            "cd /opt/ai-eval-platform && bash deploy/write-managed-env.sh '$payload_digest'" \
            <"$bundle"

      - name: Deploy
        env:
          API_IMAGE: ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/ai-eval-platform-api@${{ needs.build.outputs.api_digest }}
          WEB_IMAGE: ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/ai-eval-platform-web@${{ needs.build.outputs.web_digest }}
          GIT_COMMIT: ${{ github.sha }}
          DEPLOY_TRIGGERED_BY: ${{ github.actor }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ssh "root@${{ secrets.ECS_HOST }}" \
            "cd /opt/ai-eval-platform && API_IMAGE='$API_IMAGE' WEB_IMAGE='$WEB_IMAGE' GIT_COMMIT='$GIT_COMMIT' DEPLOY_TRIGGERED_BY='$DEPLOY_TRIGGERED_BY' DEPLOY_RUN_ID='$DEPLOY_RUN_ID' DEPLOY_RUN_URL='$DEPLOY_RUN_URL' bash deploy/deploy.sh"
      - name: Provision initial administrator
        if: env.AUTH_BOOTSTRAP_ADMIN_PASSWORD != ''
        run: |
          printf '%s' "$AUTH_BOOTSTRAP_ADMIN_PASSWORD" \
            | ssh "root@${{ secrets.ECS_HOST }}" \
              "cd /opt/ai-eval-platform && docker compose --env-file .env -f deploy/docker-compose.prod.yml exec -T api python -m app.manage create-admin --email '${AUTH_BOOTSTRAP_ADMIN_EMAIL:-admin@acme.local}' --password-stdin"
      - name: Verify public health
        run: curl -fsS "http://${{ secrets.ECS_HOST }}:8080/readyz"

  # M5-18 controlled rollback: restore the application images saved in
  # .state/previous.env by the last deploy. rollback.sh records a
  # ``rolled_back`` row (with target id, actor and stage timeline); it never
  # runs a database downgrade.
  rollback:
    name: rollback to previous images
    if: github.event_name == 'repository_dispatch' && github.event.client_payload.deployment_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DEPLOYMENT_ID: ${{ github.event.client_payload.deployment_id }}
      ROLLBACK_COMMIT: ${{ github.event.client_payload.git_commit }}
      REQUESTED_BY: ${{ github.event.client_payload.requested_by }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate rollback payload
        run: |
          [[ "$DEPLOYMENT_ID" =~ ^[A-Za-z0-9-]+$ ]] || { echo "invalid deployment_id" >&2; exit 1; }
          [[ "$ROLLBACK_COMMIT" =~ ^[0-9a-f]{7,64}$ ]] || { echo "invalid git_commit" >&2; exit 1; }
          [[ "$REQUESTED_BY" =~ ^[A-Za-z0-9@._+-]+$ ]] || { echo "invalid requested_by" >&2; exit 1; }
      - name: Install SSH key
        env:
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ECS_SSH_KEY" | awk '1' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$ECS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Copy deploy scripts
        run: |
          ssh "root@${{ secrets.ECS_HOST }}" 'rm -rf /opt/ai-eval-platform/deploy'
          scp -r deploy "root@${{ secrets.ECS_HOST }}:/opt/ai-eval-platform/"
      - name: Roll back application images
        env:
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ssh "root@${{ secrets.ECS_HOST }}" \
            "cd /opt/ai-eval-platform && DEPLOY_ROLLBACK_OF_ID='$DEPLOYMENT_ID' GIT_COMMIT='$ROLLBACK_COMMIT' DEPLOY_TRIGGERED_BY='$REQUESTED_BY' DEPLOY_RUN_ID='$DEPLOY_RUN_ID' DEPLOY_RUN_URL='$DEPLOY_RUN_URL' DEPLOY_ENVIRONMENT=production bash deploy/rollback.sh"
      - name: Verify public health
        run: curl -fsS "http://${{ secrets.ECS_HOST }}:8080/readyz"
