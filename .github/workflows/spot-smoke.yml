# M4-04 real Aliyun spot smoke. Opt-in and cost-bearing: it only runs when a
# maintainer adds the `run-spot-smoke` label to a same-repository PR (or via
# manual workflow_dispatch). It creates exactly one spot instance, executes a
# tiny runner-smoke job on the ephemeral runner, then deregisters and releases
# the instance. Evidence is uploaded as an artifact; no secret is printed.
name: spot-smoke

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'run-spot-smoke' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run real spot + ephemeral runner smoke
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIYUN_REGION: ${{ secrets.ALIYUN_REGION }}
          RUNNER_ADMIN_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          SPOT_SMOKE_CONFIRM: "1"
          SPOT_SMOKE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          # A healthy 100 Mbps bootstrap registers in ~2-4 minutes; fail at 6
          # minutes so Cloud Assistant diagnostics arrive quickly.
          SPOT_SMOKE_RUNNER_TIMEOUT: "360"
        run: >
          python tests/integration/m4_04_spot_smoke.py
          --out reports/2026-11-10/m4-04-spot/evidence.json
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-04-spot-smoke
          path: reports/2026-11-10/m4-04-spot
          if-no-files-found: warn
