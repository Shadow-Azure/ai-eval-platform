# One workflow run per shard, executed on the fixed self-hosted Linux runner.
#
# M4-01: `prepare` turns the shard manifest into a GitHub matrix where every
# `execute` job runs exactly one case, so a failing case never cancels its
# siblings and duplicate/replayed jobs exit before the agent starts. Excess
# cases wait on the platform's per-evaluation concurrency cap (started → 429
# capacity_waiting) instead of creating extra attempts.
#
# M2-05: the platform worker POSTs a repository_dispatch whose client_payload
# satisfies runner-contract/schemas/v1/dispatch.schema.json. The payload is a
# reference only — opaque IDs, the manifest URL, the scheduler labels and the
# job timeout; cases, prompts, the manifest digest/expiry and the short-term
# token are fetched by the runner. Neither `prepare` nor `execute` passes case
# data or credentials through the workflow env.
#
# M8-51 (#323) option C: the dispatch keeps only the eight fields a job needs
# before it starts; prepare/execute read the digest and expiry from the shard
# manifest response headers and the scripts bundle pin from /scripts.
#
# workflow_dispatch (manual) is a bootstrap: it asks the platform to create a
# synthetic evaluation, and the platform's dispatch loop triggers the real
# repository_dispatch run (this also re-verifies the GitHub queue pickup hop).
#
# M4-04 adds a `runner-smoke` mode: the spot provisioner smoke registers a
# unique label, dispatches this workflow at the ticket branch with
# mode=runner-smoke and runs_on=["self-hosted","<label>"], and the `smoke` job
# proves the ephemeral instance picked up and executed a job. It never touches
# the platform API or any credential.
name: eval-shard

# M4-02: the display title embeds the dispatch key, which starts with the
# evaluation run id, so the platform worker can find the dispatched run and
# cancel it (a repository_dispatch's run title carries no other eval id).
# workflow_dispatch falls back to the GitHub run id. Only dispatch_key and the
# schema-bounded job_timeout_minutes integer are interpolated from the payload.
run-name: "eval-shard ${{ github.event.client_payload.dispatch_key || github.run_id }}${{ github.event.inputs.smoke_id && format(' smoke-{0}', github.event.inputs.smoke_id) || '' }}"

on:
  workflow_dispatch:
    inputs:
      callback_base_url:
        description: "Platform API base URL reachable from the runner host"
        default: "http://127.0.0.1:8000"
      case_count:
        description: "Number of synthetic cases in the bootstrap evaluation"
        default: "2"
      mode:
        description: "eval = bootstrap an evaluation; runner-smoke = prove a spot runner executes a job; trace-e2e = real Claude trace validation"
        type: choice
        options: [eval, runner-smoke, trace-e2e]
        default: eval
      smoke_id:
        description: "Unique id embedded in the run title for the runner smoke"
        default: ""
      runs_on:
        description: "JSON label array for mode=runner-smoke"
        default: '["self-hosted","linux","eval"]'
  repository_dispatch:
    types: [eval-shard]

permissions:
  contents: read

concurrency:
  group: eval-shard-${{ github.event.client_payload.dispatch_key || github.run_id }}
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'runner-smoke'
    runs-on: ${{ fromJson(inputs.runs_on || '["self-hosted","linux","eval"]') }}
    timeout-minutes: 10
    steps:
      - name: Prove the ephemeral runner executes a job
        env:
          SMOKE_ID: ${{ inputs.smoke_id }}
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "smoke_id=${SMOKE_ID:-none}"
          hostname
          test -n "${RUNNER_NAME:-}"
          docker version
          echo "runner smoke job completed"
      - name: Verify cold spot auto-upgrade hardening
        run: |
          set -euo pipefail
          # runner-smoke also runs on the fixed runner; the hardening contract
          # belongs to provisioner-created spot instances only.
          if [[ "${RUNNER_NAME:-}" != spot-* ]]; then
            echo "not a cold spot runner (${RUNNER_NAME:-unknown}); skipping hardening check"
            exit 0
          fi
          units=(
            apt-daily.timer apt-daily-upgrade.timer apt-daily.service
            apt-daily-upgrade.service unattended-upgrades.service ua-timer.timer
          )
          statuses="$(systemctl is-enabled "${units[@]}" || true)"
          echo "$statuses"
          masked=0
          for status in $statuses; do
            [ "$status" = "masked" ] && masked=$((masked + 1))
          done
          test "$masked" -eq 6
          # Capture first: pipefail turns `producer | grep -q` into SIGPIPE
          # when grep exits on the first match.
          apt_config="$(apt-config dump)"
          grep -q 'APT::Periodic::Update-Package-Lists "0";' <<<"$apt_config"
          grep -q 'APT::Periodic::Unattended-Upgrade "0";' <<<"$apt_config"
          grep -q "nrconf{restart} = 'l';" /etc/needrestart/conf.d/99-eval-no-restart.conf
          test ! -f /var/run/reboot-required
          exec_start="$(systemctl show github-runner -p ExecStart)"
          grep -q 'systemd-inhibit' <<<"$exec_start"
          if [ -f /etc/eval/runner-image-baked ]; then
            echo "runner image: baked and immutable"
          else
            echo "runner image: stock cloud image (legacy cloud-init fallback)"
          fi
          echo "auto-upgrade hardening verified"

  trace-e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'trace-e2e'
    runs-on: [self-hosted, linux, eval]
    timeout-minutes: 30
    env:
      S3_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
      S3_BUCKET: ${{ secrets.OSS_BUCKET }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      S3_REGION: ${{ secrets.ALIYUN_REGION }}
      S3_ADDRESSING_STYLE: virtual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned Claude Code 2.1.278
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/m6-claude-cli" \
            @anthropic-ai/claude-code@2.1.278 \
            --registry=https://registry.npmmirror.com
          echo "$RUNNER_TEMP/m6-claude-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Start disposable PostgreSQL
        env:
          PG_CONTAINER: m6-trace-e2e-pg
        run: |
          set -euo pipefail
          docker rm -f "$PG_CONTAINER" >/dev/null 2>&1 || true
          docker run -d --rm --name "$PG_CONTAINER" \
            -e POSTGRES_PASSWORD=m6-e2e-pg \
            -p 127.0.0.1:55432:5432 \
            postgres:16-alpine
          for _ in $(seq 1 60); do
            docker exec "$PG_CONTAINER" pg_isready -U postgres && exit 0
            sleep 1
          done
          docker logs "$PG_CONTAINER"
          exit 1
      - name: Run real Claude trace E2E against OSS
        env:
          TRACE_E2E_DATABASE_URL: postgresql+psycopg://postgres:m6-e2e-pg@127.0.0.1:55432/postgres
          TMPDIR: ${{ runner.temp }}/m6-e2e-work
          RUNNER_NAME: ${{ runner.name }}
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR" reports/2026-11-12/m6-06-trace-e2e-validation
          python tests/integration/m6_06_trace_e2e.py \
            --object-store oss \
            --keep-workdir \
            --out reports/2026-11-12/m6-06-trace-e2e-validation/evidence.json
          node runner/lib/trace-e2e.mjs \
            reports/2026-11-12/m6-06-trace-e2e-validation/evidence.json
      - name: Upload trace E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-trace-e2e-${{ github.run_id }}
          path: |
            reports/2026-11-12/m6-06-trace-e2e-validation/**
            ${{ runner.temp }}/m6-e2e-work/**/*.log
          if-no-files-found: warn
      - name: Stop disposable PostgreSQL
        if: always()
        env:
          PG_CONTAINER: m6-trace-e2e-pg
        run: docker rm -f "$PG_CONTAINER" >/dev/null 2>&1 || true

  bootstrap:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'eval'
    runs-on: [self-hosted, linux, eval]
    timeout-minutes: 5
    steps:
      - name: Ask the platform to create and dispatch a synthetic evaluation
        env:
          CALLBACK_BASE_URL: ${{ inputs.callback_base_url || 'http://127.0.0.1:8000' }}
          CASE_COUNT: ${{ inputs.case_count || '2' }}
        run: |
          set -euo pipefail
          python3 - "$CALLBACK_BASE_URL" "$CASE_COUNT" <<'PY'
          import json, sys, time, urllib.request

          base_url, case_count = sys.argv[1], int(sys.argv[2])
          body = json.dumps({
              "name": "eval-shard manual bootstrap",
              "case_keys": [f"bootstrap-case-{i + 1}" for i in range(case_count)],
              "idempotency_key": f"eval-shard-{time.time_ns()}",
          }).encode()
          request = urllib.request.Request(
              f"{base_url}/api/v1/evaluations",
              data=body,
              method="POST",
              headers={"content-type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              payload = json.load(response)
          print(f"evaluation created: {payload['id']} status={payload['status']}")
          PY

  prepare:
    if: github.event_name == 'repository_dispatch'
    runs-on: [self-hosted, linux, eval]
    timeout-minutes: 10
    outputs:
      cases: ${{ steps.plan.outputs.cases }}
      runs_on: ${{ steps.plan.outputs.runs_on }}
    steps:
      # M8-47 (#312): the image pre-seed is the primary source, direct private
      # OSS is the secondary source, and GitHub checkout is the last fallback.
      # The whole acquisition (metadata + download) is bounded by
      # RUNNER_SCRIPTS_FETCH_BUDGET_MS so a dead endpoint reaches
      # runner_bootstrap_failed instead of stalling startup.
      - name: Fetch the scripts bundle
        id: bundle
        timeout-minutes: 2
        env:
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          RUNNER_SCRIPTS_IMAGE_DIR: /opt/eval/runner-scripts
          RUNNER_SCRIPTS_FETCH_BUDGET_MS: "60000"
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/eval-dispatch"
          printf '%s' "$DISPATCH_PAYLOAD" > "$RUNNER_TEMP/eval-dispatch/dispatch.json"
          rm -rf "$RUNNER_TEMP/eval-scripts"
          mkdir -p "$RUNNER_TEMP/eval-scripts"
          rm -f "$RUNNER_TEMP/eval-scripts.tar.gz"
          if node - "$RUNNER_TEMP/eval-dispatch/dispatch.json" "$RUNNER_TEMP/eval-scripts.tar.gz" <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const path = require("node:path");

          const dispatch = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const archive = process.argv[3];
          const pin = dispatch.scripts_bundle || {};
          const expected = {
            // The name becomes a path component below, so reject anything that
            // is not the content-addressed form before it can escape the cache.
            name:
              typeof pin.name === "string" &&
              /^eval-runner-scripts-[0-9a-f]{32}\.tar\.gz$/.test(pin.name)
                ? pin.name
                : "",
            md5: typeof pin.md5 === "string" ? pin.md5 : "",
            sha256: typeof pin.sha256 === "string" ? pin.sha256 : "",
            size: Number(pin.size || 0),
          };
          const imageDir = process.env.RUNNER_SCRIPTS_IMAGE_DIR || "/opt/eval/runner-scripts";
          const budgetMs = Number(process.env.RUNNER_SCRIPTS_FETCH_BUDGET_MS || 60000);
          const deadline = Date.now() + budgetMs;
          const digest = (bytes, algorithm) =>
            crypto.createHash(algorithm).update(bytes).digest("hex");

          function remaining() {
            const left = deadline - Date.now();
            if (left <= 0) throw new Error("scripts bundle fetch budget exhausted");
            return left;
          }

          function verify(bytes, metadata) {
            const sha256 = expected.sha256 || metadata?.sha256 || "";
            const md5 = expected.md5 || metadata?.md5 || "";
            const size = expected.size || Number(metadata?.size || 0);
            if (!sha256 && !md5) throw new Error("bundle metadata has no digest");
            if (expected.sha256 && metadata?.sha256 && expected.sha256 !== metadata.sha256) {
              throw new Error("dispatch/metadata sha256 disagree");
            }
            if (expected.md5 && metadata?.md5 && expected.md5 !== metadata.md5) {
              throw new Error("dispatch/metadata md5 disagree");
            }
            if (sha256 && digest(bytes, "sha256") !== sha256) throw new Error("sha256 mismatch");
            if (md5 && digest(bytes, "md5") !== md5) throw new Error("md5 mismatch");
            if (size && bytes.length !== size) throw new Error(`size ${bytes.length} != ${size}`);
          }

          function readImageCache() {
            // A dispatch without a pinned digest cannot prove a cached file is
            // the expected bundle, so only a complete pin may use the image.
            if (!expected.name || !expected.sha256) return null;
            const candidate = path.join(imageDir, expected.name);
            if (!fs.existsSync(candidate)) return null;
            const bytes = fs.readFileSync(candidate);
            verify(bytes, null);
            return bytes;
          }

          async function get(url, headers = {}, timeout = 20000) {
            const response = await fetch(url, {
              headers,
              signal: AbortSignal.timeout(Math.min(timeout, remaining())),
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return Buffer.from(await response.arrayBuffer());
          }

          (async () => {
            let bytes = null;
            let source = "";
            try {
              bytes = readImageCache();
              if (bytes) source = "image";
            } catch (error) {
              console.error(`scripts bundle image cache rejected: ${error.message}`);
            }

            let metadata = null;
            if (!bytes) {
              const metadataUrl = new URL(dispatch.manifest_url);
              metadataUrl.pathname = metadataUrl.pathname.replace(/\/manifest$/, "/scripts");
              try {
                metadata = JSON.parse((await get(metadataUrl.toString(), {}, 10000)).toString("utf8"));
              } catch (error) {
                console.error(`scripts bundle metadata unavailable: ${error.message}`);
              }
            }

            if (!bytes && metadata) {
              if (expected.name && metadata.name && expected.name !== metadata.name) {
                throw new Error(`metadata bundle ${metadata.name} != pinned ${expected.name}`);
              }
              const candidates = [
                ["oss", metadata.oss_url, {}],
                [
                  "proxy",
                  metadata.url,
                  metadata.token ? { authorization: `Bearer ${metadata.token}` } : {},
                ],
              ];
              for (const [kind, url, headers] of candidates) {
                if (!url) continue;
                try {
                  const candidate = await get(url, headers, 20000);
                  verify(candidate, metadata);
                  bytes = candidate;
                  source = kind;
                  break;
                } catch (error) {
                  console.error(`scripts bundle ${kind} path failed: ${error.message}`);
                }
              }
            }

            if (!bytes) throw new Error("image cache and OSS sources unavailable");
            fs.writeFileSync(archive, bytes);
            console.log(
              `scripts bundle ${expected.name || metadata?.name || "unknown"} ` +
                `source=${source} size=${bytes.length}`,
            );
          })().catch((error) => {
            console.error(`scripts bundle unavailable: ${error.message}`);
            process.exit(1);
          });
          NODE
          then
            if tar -xzf "$RUNNER_TEMP/eval-scripts.tar.gz" -C "$RUNNER_TEMP/eval-scripts"; then
              echo "EVAL_SCRIPTS_DIR=$RUNNER_TEMP/eval-scripts" >> "$GITHUB_ENV"
              echo "ok=true" >> "$GITHUB_OUTPUT"
            else
              echo "ok=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=scripts-bundle-fallback::脚本包解压失败，回退 actions/checkout"
            fi
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=scripts-bundle-fallback::脚本包不可用，回退 actions/checkout"
          fi
      - name: Checkout (fallback)
        id: fallback_checkout
        if: steps.bundle.outputs.ok != 'true'
        timeout-minutes: 1
        uses: actions/checkout@v4
        continue-on-error: true
      - name: Use the checked-out repository scripts
        if: steps.bundle.outputs.ok != 'true' && steps.fallback_checkout.outcome == 'success'
        run: echo "EVAL_SCRIPTS_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Materialize and validate the dispatch payload
        env:
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          : "${EVAL_SCRIPTS_DIR:?EVAL_SCRIPTS_DIR is not set}"
          cd "$EVAL_SCRIPTS_DIR"
          node runner/lib/contracts.mjs dispatch "$RUNNER_TEMP/eval-dispatch/dispatch.json"

      - name: Plan one matrix entry per case
        id: plan
        run: |
          set -euo pipefail
          : "${EVAL_SCRIPTS_DIR:?EVAL_SCRIPTS_DIR is not set}"
          cd "$EVAL_SCRIPTS_DIR"
          # M5-08: a spot pool may register custom labels; execute must target
          # the same labels the dispatch froze. The contract makes the field
          # optional so older dispatches keep their historical default.
          runs_on=$(node -e '
            const fs = require("node:fs");
            const dispatch = JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE, "utf8"));
            const labels = Array.isArray(dispatch.runs_on) && dispatch.runs_on.length
              ? dispatch.runs_on
              : ["self-hosted", "linux", "eval"];
            process.stdout.write(JSON.stringify(labels));
          ')
          echo "runs_on=$runs_on" >> "$GITHUB_OUTPUT"
          cases=$(node runner/scripts/plan-cases.mjs \
            --dispatch "$RUNNER_TEMP/eval-dispatch/dispatch.json" \
            --state-dir "$RUNNER_TEMP/eval-state")
          echo "cases=$cases" >> "$GITHUB_OUTPUT"
        env:
          DISPATCH_FILE: ${{ runner.temp }}/eval-dispatch/dispatch.json

  execute:
    needs: prepare
    if: github.event_name == 'repository_dispatch' && needs.prepare.outputs.cases != '[]'
    runs-on: ${{ fromJson(needs.prepare.outputs.runs_on || '["self-hosted","linux","eval"]') }}
    # M8-43 (#304): the platform derives this from the frozen case
    # budget (job > case > agent). Older dispatches fall back to 60.
    timeout-minutes: ${{ github.event.client_payload.job_timeout_minutes || 60 }}
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJson(needs.prepare.outputs.cases) }}
    steps:
      # M8-47 (#312): the image pre-seed is the primary source, direct private
      # OSS is the secondary source, and GitHub checkout is the last fallback.
      # The whole acquisition (metadata + download) is bounded by
      # RUNNER_SCRIPTS_FETCH_BUDGET_MS so a dead endpoint reaches
      # runner_bootstrap_failed instead of stalling startup.
      - name: Fetch the scripts bundle
        id: bundle
        timeout-minutes: 2
        env:
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          RUNNER_SCRIPTS_IMAGE_DIR: /opt/eval/runner-scripts
          RUNNER_SCRIPTS_FETCH_BUDGET_MS: "60000"
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/eval-dispatch"
          printf '%s' "$DISPATCH_PAYLOAD" > "$RUNNER_TEMP/eval-dispatch/dispatch.json"
          rm -rf "$RUNNER_TEMP/eval-scripts"
          mkdir -p "$RUNNER_TEMP/eval-scripts"
          rm -f "$RUNNER_TEMP/eval-scripts.tar.gz"
          if node - "$RUNNER_TEMP/eval-dispatch/dispatch.json" "$RUNNER_TEMP/eval-scripts.tar.gz" <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const path = require("node:path");

          const dispatch = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const archive = process.argv[3];
          const pin = dispatch.scripts_bundle || {};
          const expected = {
            // The name becomes a path component below, so reject anything that
            // is not the content-addressed form before it can escape the cache.
            name:
              typeof pin.name === "string" &&
              /^eval-runner-scripts-[0-9a-f]{32}\.tar\.gz$/.test(pin.name)
                ? pin.name
                : "",
            md5: typeof pin.md5 === "string" ? pin.md5 : "",
            sha256: typeof pin.sha256 === "string" ? pin.sha256 : "",
            size: Number(pin.size || 0),
          };
          const imageDir = process.env.RUNNER_SCRIPTS_IMAGE_DIR || "/opt/eval/runner-scripts";
          const budgetMs = Number(process.env.RUNNER_SCRIPTS_FETCH_BUDGET_MS || 60000);
          const deadline = Date.now() + budgetMs;
          const digest = (bytes, algorithm) =>
            crypto.createHash(algorithm).update(bytes).digest("hex");

          function remaining() {
            const left = deadline - Date.now();
            if (left <= 0) throw new Error("scripts bundle fetch budget exhausted");
            return left;
          }

          function verify(bytes, metadata) {
            const sha256 = expected.sha256 || metadata?.sha256 || "";
            const md5 = expected.md5 || metadata?.md5 || "";
            const size = expected.size || Number(metadata?.size || 0);
            if (!sha256 && !md5) throw new Error("bundle metadata has no digest");
            if (expected.sha256 && metadata?.sha256 && expected.sha256 !== metadata.sha256) {
              throw new Error("dispatch/metadata sha256 disagree");
            }
            if (expected.md5 && metadata?.md5 && expected.md5 !== metadata.md5) {
              throw new Error("dispatch/metadata md5 disagree");
            }
            if (sha256 && digest(bytes, "sha256") !== sha256) throw new Error("sha256 mismatch");
            if (md5 && digest(bytes, "md5") !== md5) throw new Error("md5 mismatch");
            if (size && bytes.length !== size) throw new Error(`size ${bytes.length} != ${size}`);
          }

          function readImageCache() {
            // A dispatch without a pinned digest cannot prove a cached file is
            // the expected bundle, so only a complete pin may use the image.
            if (!expected.name || !expected.sha256) return null;
            const candidate = path.join(imageDir, expected.name);
            if (!fs.existsSync(candidate)) return null;
            const bytes = fs.readFileSync(candidate);
            verify(bytes, null);
            return bytes;
          }

          async function get(url, headers = {}, timeout = 20000) {
            const response = await fetch(url, {
              headers,
              signal: AbortSignal.timeout(Math.min(timeout, remaining())),
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return Buffer.from(await response.arrayBuffer());
          }

          (async () => {
            let bytes = null;
            let source = "";
            try {
              bytes = readImageCache();
              if (bytes) source = "image";
            } catch (error) {
              console.error(`scripts bundle image cache rejected: ${error.message}`);
            }

            let metadata = null;
            if (!bytes) {
              const metadataUrl = new URL(dispatch.manifest_url);
              metadataUrl.pathname = metadataUrl.pathname.replace(/\/manifest$/, "/scripts");
              try {
                metadata = JSON.parse((await get(metadataUrl.toString(), {}, 10000)).toString("utf8"));
              } catch (error) {
                console.error(`scripts bundle metadata unavailable: ${error.message}`);
              }
            }

            if (!bytes && metadata) {
              if (expected.name && metadata.name && expected.name !== metadata.name) {
                throw new Error(`metadata bundle ${metadata.name} != pinned ${expected.name}`);
              }
              const candidates = [
                ["oss", metadata.oss_url, {}],
                [
                  "proxy",
                  metadata.url,
                  metadata.token ? { authorization: `Bearer ${metadata.token}` } : {},
                ],
              ];
              for (const [kind, url, headers] of candidates) {
                if (!url) continue;
                try {
                  const candidate = await get(url, headers, 20000);
                  verify(candidate, metadata);
                  bytes = candidate;
                  source = kind;
                  break;
                } catch (error) {
                  console.error(`scripts bundle ${kind} path failed: ${error.message}`);
                }
              }
            }

            if (!bytes) throw new Error("image cache and OSS sources unavailable");
            fs.writeFileSync(archive, bytes);
            console.log(
              `scripts bundle ${expected.name || metadata?.name || "unknown"} ` +
                `source=${source} size=${bytes.length}`,
            );
          })().catch((error) => {
            console.error(`scripts bundle unavailable: ${error.message}`);
            process.exit(1);
          });
          NODE
          then
            if tar -xzf "$RUNNER_TEMP/eval-scripts.tar.gz" -C "$RUNNER_TEMP/eval-scripts"; then
              echo "EVAL_SCRIPTS_DIR=$RUNNER_TEMP/eval-scripts" >> "$GITHUB_ENV"
              echo "ok=true" >> "$GITHUB_OUTPUT"
            else
              echo "ok=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=scripts-bundle-fallback::脚本包解压失败，回退 actions/checkout"
            fi
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=scripts-bundle-fallback::脚本包不可用，回退 actions/checkout"
          fi
      - name: Checkout (fallback)
        id: fallback_checkout
        if: steps.bundle.outputs.ok != 'true'
        timeout-minutes: 1
        uses: actions/checkout@v4
        continue-on-error: true
      - name: Use the checked-out repository scripts
        if: steps.bundle.outputs.ok != 'true' && steps.fallback_checkout.outcome == 'success'
        run: echo "EVAL_SCRIPTS_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      # runner.temp is per job: never read the prepare job's dispatch file.
      - name: Materialize and validate the dispatch payload
        id: validate_dispatch
        env:
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          : "${EVAL_SCRIPTS_DIR:?EVAL_SCRIPTS_DIR is not set}"
          cd "$EVAL_SCRIPTS_DIR"
          node runner/lib/contracts.mjs dispatch "$RUNNER_TEMP/eval-dispatch/dispatch.json"

      - name: Execute exactly one case
        id: execute_case
        env:
          RUNNER_PRESIGN_UPLOADS: "1"
          RUNNER_STATE_DIR: ${{ runner.temp }}/eval-state
          RUNNER_OBJECT_ROOT: ${{ runner.temp }}/eval-objects
        run: |
          set -euo pipefail
          : "${EVAL_SCRIPTS_DIR:?EVAL_SCRIPTS_DIR is not set}"
          cd "$EVAL_SCRIPTS_DIR"
          node runner/scripts/real-task.mjs \
            --dispatch "$RUNNER_TEMP/eval-dispatch/dispatch.json" \
            --case "${{ matrix.case.id }}" \
            --state-dir "$RUNNER_STATE_DIR" \
            --object-store-root "$RUNNER_OBJECT_ROOT"

      # M8-44 (#306): a job that dies before real-task reaches `started` used to
      # leave the platform waiting for the 3600s queue timeout. Settle the
      # attempt now with a retryable bootstrap failure. The manifest endpoint
      # (not the scripts bundle) issues the short token, so this works even when
      # `Fetch the scripts bundle` or the checkout fallback already failed.
      # real-task writes markers for "capacity wait, attempt stays queued" and
      # "started already happened"; both must NOT be re-settled as bootstrap.
      - name: Report bootstrap failure
        if: failure() || cancelled()
        continue-on-error: true
        env:
          DISPATCH_FILE: ${{ runner.temp }}/eval-dispatch/dispatch.json
          CASE_RUN_ID: ${{ matrix.case.id }}
          RUNNER_STATE_DIR: ${{ runner.temp }}/eval-state
          BUNDLE_OUTCOME: ${{ steps.bundle.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.fallback_checkout.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate_dispatch.outcome }}
          EXECUTE_OUTCOME: ${{ steps.execute_case.outcome }}
        run: |
          set -uo pipefail
          node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const caseRunId = process.env.CASE_RUN_ID;
          const stateDir = process.env.RUNNER_STATE_DIR;
          const timeoutMs = 15000;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function request(url, init = {}, attempts = 3) {
            let lastError;
            for (let attempt = 0; attempt < attempts; attempt += 1) {
              try {
                const response = await fetch(url, {
                  ...init,
                  signal: AbortSignal.timeout(timeoutMs),
                });
                if (!response.ok && response.status !== 409) {
                  throw new Error(`HTTP ${response.status}`);
                }
                return response;
              } catch (error) {
                lastError = error;
                if (attempt < attempts - 1) await sleep(500 * (attempt + 1));
              }
            }
            throw lastError;
          }

          (async () => {
            // real-task deliberately leaves a capacity-wait attempt queued for
            // a re-run; a post-started crash is the heartbeat/reaper's job.
            if (stateDir) {
              if (fs.existsSync(path.join(stateDir, `.capacity-wait-${caseRunId}`))) {
                console.log("capacity-wait marker: leaving the queued attempt for a re-run");
                return;
              }
              if (fs.existsSync(path.join(stateDir, `.started-${caseRunId}`))) {
                console.log("started marker: leaving the running attempt to its terminal callback");
                return;
              }
            }

            const dispatch = JSON.parse(fs.readFileSync(process.env.DISPATCH_FILE, "utf8"));
            const response = await request(dispatch.manifest_url);
            const token = response.headers.get("x-runner-task-token");
            const manifest = JSON.parse(await response.text());
            if (!token) throw new Error("manifest response missing X-Runner-Task-Token");
            const item = (manifest.cases || []).find(
              (candidate) => candidate.case_run_id === caseRunId,
            );
            if (!item) throw new Error(`case ${caseRunId} missing from manifest`);
            const summary = (
              "execute job 启动阶段失败：" +
              `bundle=${process.env.BUNDLE_OUTCOME || "unknown"} ` +
              `checkout=${process.env.CHECKOUT_OUTCOME || "unknown"} ` +
              `validate=${process.env.VALIDATE_OUTCOME || "unknown"} ` +
              `execute=${process.env.EXECUTE_OUTCOME || "unknown"}`
            ).slice(0, 1000);
            const payload = {
              schema_version: "1.0",
              event_id: `evt_${caseRunId}_bootstrap_failed_${dispatch.attempt}`,
              case_run_id: caseRunId,
              attempt: dispatch.attempt,
              sequence: 1000002,
              error_code: "runner_bootstrap_failed",
              retryable: true,
              error_summary: summary,
              phase: "bootstrap",
            };
            const callback = await request(
              `${manifest.callback_base_url}/runner/v1/case-runs/${caseRunId}/failed`,
              {
                method: "POST",
                headers: {
                  authorization: `Bearer ${token}`,
                  "content-type": "application/json",
                },
                body: JSON.stringify(payload),
              },
            );
            const text = await callback.text();
            if (callback.ok) {
              console.log(`bootstrap failure settled: HTTP ${callback.status} ${text}`);
            } else {
              console.log(`bootstrap failure already settled: HTTP ${callback.status} ${text}`);
            }
          })().catch((error) => {
            console.error(`bootstrap failure callback failed: ${error.message}`);
            process.exitCode = 1;
          });
          NODE
