# One workflow run per shard, executed on the fixed self-hosted Linux runner.
#
# M4-01: `prepare` turns the shard manifest into a GitHub matrix where every
# `execute` job runs exactly one case, so a failing case never cancels its
# siblings and duplicate/replayed jobs exit before the agent starts. Excess
# cases wait on the platform's per-evaluation concurrency cap (started → 429
# capacity_waiting) instead of creating extra attempts.
#
# M2-05: the platform worker POSTs a repository_dispatch whose client_payload
# satisfies runner-contract/schemas/v1/dispatch.schema.json. The payload is a
# reference only — opaque IDs plus the manifest URL/digest; cases, prompts and
# the short-term token are fetched by the runner. Neither `prepare` nor
# `execute` passes case data or credentials through the workflow env.
#
# workflow_dispatch (manual) is a bootstrap: it asks the platform to create a
# synthetic evaluation, and the platform's dispatch loop triggers the real
# repository_dispatch run (this also re-verifies the GitHub queue pickup hop).
#
# M4-04 adds a `runner-smoke` mode: the spot provisioner smoke registers a
# unique label, dispatches this workflow at the ticket branch with
# mode=runner-smoke and runs_on=["self-hosted","<label>"], and the `smoke` job
# proves the ephemeral instance picked up and executed a job. It never touches
# the platform API or any credential.
name: eval-shard

# M4-02: the display title embeds the dispatch key, which starts with the
# evaluation run id, so the platform worker can find the dispatched run and
# cancel it (a repository_dispatch's run title carries no other eval id).
# workflow_dispatch falls back to the GitHub run id. dispatch_key is also the
# only client_payload field this workflow is allowed to interpolate.
run-name: "eval-shard ${{ github.event.client_payload.dispatch_key || github.run_id }}${{ github.event.inputs.smoke_id && format(' smoke-{0}', github.event.inputs.smoke_id) || '' }}"

on:
  workflow_dispatch:
    inputs:
      callback_base_url:
        description: "Platform API base URL reachable from the runner host"
        default: "http://127.0.0.1:8000"
      case_count:
        description: "Number of synthetic cases in the bootstrap evaluation"
        default: "2"
      mode:
        description: "eval = bootstrap an evaluation; runner-smoke = prove a spot runner executes a job"
        type: choice
        options: [eval, runner-smoke]
        default: eval
      smoke_id:
        description: "Unique id embedded in the run title for the runner smoke"
        default: ""
      runs_on:
        description: "JSON label array for mode=runner-smoke"
        default: '["self-hosted","linux","eval"]'
  repository_dispatch:
    types: [eval-shard]

permissions:
  contents: read

concurrency:
  group: eval-shard-${{ github.event.client_payload.dispatch_key || github.run_id }}
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'runner-smoke'
    runs-on: ${{ fromJson(inputs.runs_on || '["self-hosted","linux","eval"]') }}
    timeout-minutes: 10
    steps:
      - name: Prove the ephemeral runner executes a job
        env:
          SMOKE_ID: ${{ inputs.smoke_id }}
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "smoke_id=${SMOKE_ID:-none}"
          hostname
          test -n "${RUNNER_NAME:-}"
          docker version
          echo "runner smoke job completed"

  bootstrap:
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'runner-smoke'
    runs-on: [self-hosted, linux, eval]
    timeout-minutes: 5
    steps:
      - name: Ask the platform to create and dispatch a synthetic evaluation
        env:
          CALLBACK_BASE_URL: ${{ inputs.callback_base_url || 'http://127.0.0.1:8000' }}
          CASE_COUNT: ${{ inputs.case_count || '2' }}
        run: |
          set -euo pipefail
          python3 - "$CALLBACK_BASE_URL" "$CASE_COUNT" <<'PY'
          import json, sys, time, urllib.request

          base_url, case_count = sys.argv[1], int(sys.argv[2])
          body = json.dumps({
              "name": "eval-shard manual bootstrap",
              "case_keys": [f"bootstrap-case-{i + 1}" for i in range(case_count)],
              "idempotency_key": f"eval-shard-{time.time_ns()}",
          }).encode()
          request = urllib.request.Request(
              f"{base_url}/api/v1/evaluations",
              data=body,
              method="POST",
              headers={"content-type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              payload = json.load(response)
          print(f"evaluation created: {payload['id']} status={payload['status']}")
          PY

  prepare:
    if: github.event_name == 'repository_dispatch'
    runs-on: [self-hosted, linux, eval]
    timeout-minutes: 5
    outputs:
      cases: ${{ steps.plan.outputs.cases }}
    steps:
      - uses: actions/checkout@v4

      - name: Materialize and validate the dispatch payload
        env:
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/eval-dispatch"
          printf '%s' "$DISPATCH_PAYLOAD" > "$RUNNER_TEMP/eval-dispatch/dispatch.json"
          node runner/lib/contracts.mjs dispatch "$RUNNER_TEMP/eval-dispatch/dispatch.json"

      - name: Plan one matrix entry per case
        id: plan
        run: |
          set -euo pipefail
          cases=$(node runner/scripts/plan-cases.mjs \
            --dispatch "$RUNNER_TEMP/eval-dispatch/dispatch.json" \
            --state-dir "$RUNNER_TEMP/eval-state")
          echo "cases=$cases" >> "$GITHUB_OUTPUT"

  execute:
    needs: prepare
    if: github.event_name == 'repository_dispatch' && needs.prepare.outputs.cases != '[]'
    runs-on: [self-hosted, linux, eval]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJson(needs.prepare.outputs.cases) }}
    steps:
      - uses: actions/checkout@v4

      # runner.temp is per job: never read the prepare job's dispatch file.
      - name: Materialize and validate the dispatch payload
        env:
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/eval-dispatch"
          printf '%s' "$DISPATCH_PAYLOAD" > "$RUNNER_TEMP/eval-dispatch/dispatch.json"
          node runner/lib/contracts.mjs dispatch "$RUNNER_TEMP/eval-dispatch/dispatch.json"

      - name: Execute exactly one case
        env:
          RUNNER_PRESIGN_UPLOADS: "1"
          RUNNER_STATE_DIR: ${{ runner.temp }}/eval-state
          RUNNER_OBJECT_ROOT: ${{ runner.temp }}/eval-objects
        run: |
          set -euo pipefail
          node runner/scripts/real-task.mjs \
            --dispatch "$RUNNER_TEMP/eval-dispatch/dispatch.json" \
            --case "${{ matrix.case.id }}" \
            --state-dir "$RUNNER_STATE_DIR" \
            --object-store-root "$RUNNER_OBJECT_ROOT"
