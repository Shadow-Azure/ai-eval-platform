# Reference template for the private runner repository.
# M2-05: the platform owns dispatch/token/OSS — the workflow only validates
# the dispatch payload and executes the synthetic task. The short-lived task
# token arrives with the manifest (X-Runner-Task-Token) and never enters the
# workflow env; presigned PUTs carry the object-store credential in the URL.
# Do not commit real values here.
name: eval-shard

on:
  repository_dispatch:
    types: [eval-shard]

permissions:
  contents: read
  id-token: write

concurrency:
  group: eval-shard-${{ github.event.client_payload.dispatch_key }}
  cancel-in-progress: false

jobs:
  synthetic-shard:
    runs-on: [self-hosted, linux, eval]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate and execute synthetic shard
        env:
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          RUNNER_PRESIGN_UPLOADS: "1"
          RUNNER_STATE_DIR: ${{ runner.temp }}/eval-state
          RUNNER_OBJECT_ROOT: ${{ runner.temp }}/eval-objects
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_STATE_DIR" "$RUNNER_OBJECT_ROOT"
          printf '%s' "$DISPATCH_PAYLOAD" > "$RUNNER_TEMP/dispatch.json"
          node runner/lib/contracts.mjs dispatch "$RUNNER_TEMP/dispatch.json"
          node runner/scripts/synthetic-task.mjs \
            --dispatch "$RUNNER_TEMP/dispatch.json" \
            --state-dir "$RUNNER_STATE_DIR" \
            --object-store-root "$RUNNER_OBJECT_ROOT"
