name: ai-eval-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eval}
      POSTGRES_USER: ${POSTGRES_USER:-eval}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eval} -d ${POSTGRES_DB:-eval}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ${API_IMAGE:?API_IMAGE required}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-eval}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-eval}
      # M3-06 operations status: provisioned database storage capacity in bytes
      # for the usage watermark. 0 leaves it unconfigured; set it in the host
      # .env to the volume/budget the deployment should be measured against.
      DATABASE_STORAGE_LIMIT_BYTES: ${DATABASE_STORAGE_LIMIT_BYTES:-0}
      # M8-26: deploy-time default public image sources; administrators may
      # override the ordered list from the console.
      DATASET_IMAGE_REGISTRIES: ${DATASET_IMAGE_REGISTRIES:-docker.io}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-auto}
      # M5-08: the base URL ephemeral spot runners use to fetch the manifest
      # and post callbacks. The API host is in the same VPC; the deploy
      # workflow injects the VPC address, while loopback stays the default for
      # the fixed runner on the API host.
      RUNNER_CALLBACK_BASE_URL: ${RUNNER_CALLBACK_BASE_URL:-http://127.0.0.1:8000}
      # M8-14: forward proxy for GitHub egress from evaluation containers.
      # Empty keeps the previous direct-network behaviour; set it in the host
      # .env to the proxy service's private address (http://<vpc-ip>:3128).
      RUNNER_EGRESS_PROXY: ${RUNNER_EGRESS_PROXY:-}
      # M5-11: empty lets the api derive the permanent proxy URL from the
      # callback base URL; an explicit value overrides it with an external
      # mirror that receives no runner token.
      RUNNER_SPOT_RUNNER_TARBALL_URL: ${RUNNER_SPOT_RUNNER_TARBALL_URL:-}
      # M5-12: content-addressed runner scripts bundle metadata. The deploy
      # workflow injects the current bundle; the api serves its metadata and
      # streams the private OSS object.
      RUNNER_SCRIPTS_BUNDLE_NAME: ${RUNNER_SCRIPTS_BUNDLE_NAME:-}
      RUNNER_SCRIPTS_BUNDLE_MD5: ${RUNNER_SCRIPTS_BUNDLE_MD5:-}
      RUNNER_SCRIPTS_BUNDLE_SHA256: ${RUNNER_SCRIPTS_BUNDLE_SHA256:-}
      RUNNER_SCRIPTS_BUNDLE_SIZE: ${RUNNER_SCRIPTS_BUNDLE_SIZE:-0}
      # Runner-plane token (M2-04). Provisioned in the deploy .env; when set
      # the runner heartbeat/callback endpoints require it as a Bearer token.
      RUNNER_HEARTBEAT_TOKEN: ${RUNNER_HEARTBEAT_TOKEN:-}
      # M2-05 dispatch loop: platform-issued short-term case tokens (runner
      # verifies) and the repository_dispatch credential (repo scope).
      RUNNER_TASK_SECRET: ${RUNNER_TASK_SECRET:-}
      RUNNER_ADMIN_TOKEN: ${RUNNER_ADMIN_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-Shadow-Azure/ai-eval-platform}
      DEPLOY_ENVIRONMENT: ${DEPLOY_ENVIRONMENT:-production}
      # M3-05 console identity. AUTH_SESSION_SECRET is injected from GitHub
      # Secrets before deploy so a replacement host preserves existing sessions
      # and encrypted credentials. Seed only creates the initial administrator
      # and never overwrites an existing password.
      ENVIRONMENT: ${DEPLOY_ENVIRONMENT:-production}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-12}
      AUTH_SESSION_REMEMBER_DAYS: ${AUTH_SESSION_REMEMBER_DAYS:-30}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_BOOTSTRAP_ADMIN_EMAIL: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:-admin@acme.local}
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:-}
      # M3-02 model credentials and gateway tokens. SECRET_BOX_KEY encrypts
      # provider keys at rest; GATEWAY_TOKEN_SECRET signs the short-lived
      # tokens runners receive in the shard manifest. Both are injected from
      # GitHub Secrets and never generated on a host.
      SECRET_BOX_KEY: ${SECRET_BOX_KEY:-}
      GATEWAY_TOKEN_SECRET: ${GATEWAY_TOKEN_SECRET:-}
      GATEWAY_TOKEN_TTL_SECONDS: ${GATEWAY_TOKEN_TTL_SECONDS:-900}
      GATEWAY_TIMEOUT_SECONDS: ${GATEWAY_TIMEOUT_SECONDS:-120}
      # M5-15: upload staging and the isolated validation subprocess. Files
      # are temporary; completed imports keep only metadata and cases.
      DATASET_IMPORT_DIR: ${DATASET_IMPORT_DIR:-/tmp/eval-dataset-imports}
      DATASET_IMPORT_MAX_BYTES: ${DATASET_IMPORT_MAX_BYTES:-1073741824}
      DATASET_IMPORT_TIMEOUT_SECONDS: ${DATASET_IMPORT_TIMEOUT_SECONDS:-1800}
      DATASET_IMPORT_MEMORY_LIMIT_MB: ${DATASET_IMPORT_MEMORY_LIMIT_MB:-2048}
    volumes:
      # Shared with the worker so stale-import reaping can delete the staged
      # source file; both services must see the same path.
      - dataset_imports:/tmp/eval-dataset-imports
    # Fixed runners and the heartbeat agent run on the API host and reach the
    # platform via loopback (PLATFORM_BASE_URL=http://127.0.0.1:8000). The
    # optional docker-compose.vpc.yml override adds the VPC address used by
    # ephemeral spot runners without dropping this loopback binding.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    image: ${API_IMAGE:?API_IMAGE required}
    command: ["worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-eval}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-eval}
      REDIS_URL: redis://redis:6379/0
      WORKER_HEARTBEAT_PATH: /tmp/worker-heartbeat
      DATASET_IMAGE_REGISTRIES: ${DATASET_IMAGE_REGISTRIES:-docker.io}
      # M5-15: reap uploads abandoned by a crashed validation worker.
      DATASET_IMPORT_STALE_SECONDS: ${DATASET_IMPORT_STALE_SECONDS:-7200}
      DATASET_IMPORT_DIR: ${DATASET_IMPORT_DIR:-/tmp/eval-dataset-imports}
      # M5-11: the cloud-init renderer chooses the permanent proxy endpoint
      # only when object storage is configured, so the worker sees the same
      # OSS settings as the api.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-auto}
      # M4-04 capacity controller: decrypt the resource credential and render
      # cloud-init (heartbeat token) / register the ephemeral runner.
      SECRET_BOX_KEY: ${SECRET_BOX_KEY:-}
      RUNNER_HEARTBEAT_TOKEN: ${RUNNER_HEARTBEAT_TOKEN:-}
      RUNNER_ADMIN_TOKEN: ${RUNNER_ADMIN_TOKEN:-}
      # M5-08: the capacity controller renders cloud-init and the shard
      # dispatch loop builds manifest URLs, so the worker needs the same
      # VPC-reachable callback address as the API.
      RUNNER_CALLBACK_BASE_URL: ${RUNNER_CALLBACK_BASE_URL:-http://127.0.0.1:8000}
      RUNNER_SPOT_RUNNER_TARBALL_URL: ${RUNNER_SPOT_RUNNER_TARBALL_URL:-}
      # M5-12: the worker preflights the scripts bundle before dispatch.
      RUNNER_SCRIPTS_BUNDLE_NAME: ${RUNNER_SCRIPTS_BUNDLE_NAME:-}
      RUNNER_SCRIPTS_BUNDLE_MD5: ${RUNNER_SCRIPTS_BUNDLE_MD5:-}
      RUNNER_SCRIPTS_BUNDLE_SHA256: ${RUNNER_SCRIPTS_BUNDLE_SHA256:-}
      RUNNER_SCRIPTS_BUNDLE_SIZE: ${RUNNER_SCRIPTS_BUNDLE_SIZE:-0}
      # M2-05: the worker consumes the shard-dispatch outbox and needs the
      # same GitHub dispatch credential as the API.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-Shadow-Azure/ai-eval-platform}
    volumes:
      - dataset_imports:/tmp/eval-dataset-imports
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, time; p=os.environ.get('WORKER_HEARTBEAT_PATH','/tmp/worker-heartbeat'); assert time.time()-os.path.getmtime(p) < 30"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE required}
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  # M8-14: allowlisted forward proxy for GitHub egress from evaluation
  # containers. The private listener (3128) has no auth and the runner host
  # reaches it over the VPC; the public listener (3129) authenticates with the
  # short-lived egress token in the Basic username slot. Squid's ACLs restrict
  # sources/destinations to the runner network and GitHub, and the security
  # group is the outer boundary.
  #
  # Bind defaults are 0.0.0.0 so both published ports work out of the box; the
  # deploy workflow pins 3128 to the host's private address
  # (RUNNER_EGRESS_PROXY_BIND_ADDRESS) and 3129 stays reachable for the
  # external Mac mini. On a public interface 3128 still denies non-RFC1918
  # sources, but restrict it in the security group as well.
  #
  # RUNNER_TASK_SECRET is the same secret the API signs egress tokens with;
  # egress_auth.py re-verifies signature/expiry/scope and fails closed when it
  # is empty. The helper is mounted so rotating the secret or editing the
  # allowlist needs no image rebuild.
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    image: ${RUNNER_EGRESS_PROXY_IMAGE:-ai-eval-platform-proxy:dev}
    # M8-16: keep squid in the foreground. Without -N the image's default
    # command may daemonize and the container exits right after "Started",
    # leaving 3128/3129 closed.
    command: ["-N", "-f", "/etc/squid/squid.conf"]
    environment:
      RUNNER_TASK_SECRET: ${RUNNER_TASK_SECRET:-}
    volumes:
      - ./proxy/squid.conf:/etc/squid/squid.conf:ro
      - ./proxy/egress_auth.py:/usr/local/bin/egress_auth.py:ro
    ports:
      - "${RUNNER_EGRESS_PROXY_BIND_ADDRESS:-0.0.0.0}:3128:3128"
      - "${RUNNER_EGRESS_PROXY_PUBLIC_BIND_ADDRESS:-0.0.0.0}:3129:3129"

  migrate:
    image: ${API_IMAGE:?API_IMAGE required}
    profiles: ["tools"]
    entrypoint: ["python", "migrations/migrate_with_lock.py"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-eval}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-eval}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  dataset_imports:
  pgdata:
  redisdata:
